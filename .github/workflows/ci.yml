name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # @jucollet/trivia-client is published on GitHub Packages by trivia-server
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # npm 11 crashes while resolving the optional peer dependencies of Vitest
      - name: Use npm 12
        run: npm install --global npm@12

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Read at build time: the phones call the game server at this address (https://trivia-api.julco.dev)
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # On master only: publishes dist/ on Cloudflare Pages (https://trivia.julco.dev). The project is created by trivia-infra.
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # functions/ (the /tv relay to trivia-tv) is deployed along with dist/
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=trivia-client --branch=master
